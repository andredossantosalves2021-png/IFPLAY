<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">

    <link rel="stylesheet"
          href="https://unpkg.com/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">

    <link rel="stylesheet" href="/CADASTRO/cadastro.css?v=3">

    <link rel="icon" type="image/png" href="/LOGO/favicon.png">

    <title>IFPlay - Cadastro</title>
</head>
<body>

    <div class="logo">
        <img src="/LOGO/logoifplaynova.png" alt="Logo IFPlay">
    </div>

    <main class="container">
        <form id="cadastroForm">

            <h1>
                Cadastro
                <span class="corum">IF</span><span class="cordois">play</span>
            </h1>

            <p class="subtitulo">Cadastro de Aluno</p>
            <div class="tipo-cadastro">
                <label>
                    <input type="radio" name="tipoCadastro" value="ALUNO" checked>
                    Sou aluno
                </label>
                <label>
                    <input type="radio" name="tipoCadastro" value="PROFESSOR">
                    Sou professor/servidor
                </label>
            </div>

            <div class="input-cadastro" id="campoRa">
                <input
                    type="text"
                    id="ra"
                    placeholder="Digite sua matrícula (RA)"
                    inputmode="numeric"
                    pattern="[0-9]*"
                >
                <i class="bx bxs-id-card"></i>
            </div>

            <div class="input-cadastro">
                <input
                    type="text"
                    id="nome"
                    placeholder="Nome completo"
                    required
                >
                <i class="bx bxs-user"></i>
            </div>

            <div class="input-cadastro">
                <input
                    type="email"
                    id="email"
                    placeholder="Seu e-mail"
                    required
                >
                <i class="bx bxs-envelope"></i>
            </div>

            <div class="input-cadastro">
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha do SUAP"
                    minlength="6"
                    required
                >
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="input-cadastro">
                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Confirme sua senha do SUAP"
                    minlength="6"
                    required
                >
                <i class="bx bxs-lock-alt"></i>
            </div>

            <p id="mensagemErro" class="mensagem-erro"></p>

            <button type="submit" class="botao-cadastro">
                <i class="fa-solid fa-user-plus"></i>
                Criar conta
            </button>

            <a href="/index.html" class="link-voltar">
                <i class="fa-solid fa-arrow-left"></i>
                Voltar para o login
            </a>

        </form>
    </main>

    <!-- Aviso depois de enviar o cadastro -->
    <div class="modal-overlay" id="modalCadastroEnviado" role="dialog" aria-modal="true" aria-labelledby="tituloCadastroEnviado" hidden>
        <div class="modal-aviso">
            <div class="modal-icone"><i class="fa-solid fa-hourglass-half"></i></div>
            <h2 id="tituloCadastroEnviado">Cadastro enviado!</h2>
            <p id="textoCadastroEnviado">Aguarde a aprovação de um administrador.</p>
            <p class="modal-dica">Você poderá entrar assim que o cadastro for aprovado.</p>
            <button type="button" class="botao-cadastro" id="btnCadastroEnviado">
                Voltar para o login
            </button>
        </div>
    </div>

    <script src="/CADASTRO/cadastro.js?v=3"></script>

</body>
</html>
