<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastros Pendentes</title>

    <script>
        (function () {
            const isDark = localStorage.getItem('tema') === 'true';
            document.documentElement.className = isDark ? 'dark-mode' : '';
        })();
    </script>

    <link rel="stylesheet" href="cadastros.css?v=2">

</head>

<body>

    <div class="container">
        <div class="card">
            <h1>Cadastros Pendentes</h1>
            <div id="listaCadastros"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalConfirmacao">
        <div class="modal-sair">
            <div class="modal-icone">!</div>
            <h2>Confirmar ação</h2>
            <p id="modalTexto"></p>
            <div class="modal-acoes">
                <button class="btn-modal btn-cancelar" id="modalCancelar">Cancelar</button>
                <button class="btn-modal btn-confirmar" id="modalConfirmar">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="cadastros.js?v=3"></script>

</body>

</html>
