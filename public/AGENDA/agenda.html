<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento</title>

    <script>
        (function () {
            const isDark = localStorage.getItem('tema') === 'true';

            document.documentElement.className = isDark
                ? 'dark-mode'
                : '';
        })();
    </script>

    <link rel="stylesheet" href="agenda.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div
        id="notificacaoAgenda"
        class="notificacao"
        aria-live="polite"
    ></div>

    <div class="container">

        <div class="corpo">

            <div class="corpo-header">
                <h2>
                    Agendar Quadra
                </h2>

                <p>
                    Reserve um horário para usar a quadra
                </p>
            </div>

            <form id="formReserva">

                <div class="linha">

                    <div class="input-group">
                        <label>Nome do Usuário:</label>

                        <input id="nome" type="text" disabled>
                    </div>

                    <div class="input-group">
                        <label>Ocupação</label>

                        <select id="ocupacao" disabled>
                            <option value="ALUNO">
                                Aluno
                            </option>

                            <option value="PROFESSOR">
                                Servidor
                            </option>

                            <option value="ADMINISTRADOR">
                                Administrador
                            </option>
                        </select>
                    </div>

                </div>

                <div class="input-group">
                    <label>Tipo de Reserva</label>

                    <select id="tipoReserva">
                        <option value="JOGO_LIVRE" selected>
                            Jogo Livre
                        </option>

                        <option value="AULA">
                            Aula
                        </option>

                        <option value="EVENTO">
                            Evento
                        </option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Esporte/Atividade</label>

                    <select id="atividade">
                        <option value="">
                            Selecione o esporte
                        </option>

                        <option value="Futebol">
                            Futebol
                        </option>

                        <option value="Vôlei">
                            Vôlei
                        </option>

                        <option value="Basquete">
                            Basquete
                        </option>

                        <option value="Handebol">
                            Handebol
                        </option>

                        <option value="Outro">
                            Outro
                        </option>
                    </select>
                </div>

                <div
                    class="input-group"
                    id="outraAtividade"
                    style="display: none;"
                >
                    <label>
                        Qual atividade?
                    </label>

                    <input
                        type="text"
                        id="atividadePersonalizada"
                        placeholder="Digite a atividade"
                    >
                </div>

                <div id="agendamentoUnico">

                    <div class="input-group">
                        <label>
                            <i class="fa-regular fa-calendar"></i>
                            Data
                        </label>

                        <input
                            type="date"
                            id="dataReserva"
                        >
                    </div>

                    <div class="input-group">
                        <label>
                            <i class="fa-regular fa-clock"></i>
                            Horário Inicial
                        </label>

                        <select id="horarioInicio">
                        </select>
                    </div>

                    <div class="input-group">
                        <label>
                            Duração da Reserva
                        </label>

                        <select id="duracao">
                            <option value="1">
                                1 hora
                            </option>

                            <option value="2">
                                2 horas
                            </option>

                            <option value="3">
                                3 horas
                            </option>

                            <option value="4">
                                4 horas
                            </option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>
                            Sua reserva
                        </label>

                        <div id="resumoReserva">
                            Selecione um horário.
                        </div>
                    </div>

                </div>

                <div class="secao-recorrencia">

                    <div class="input-group checkbox-group">

                        <input
                            type="checkbox"
                            id="agendamentoRecorrente"
                        >

                        <label for="agendamentoRecorrente">
                            Reserva recorrente
                        </label>

                    </div>

                    <div
                        id="camposRecorrentes"
                        style="display: none;"
                    >

                        <div class="linha">

                            <div class="input-group">
                                <label>Data de Início</label>

                                <input
                                    type="date"
                                    id="dataInicioRecorrente"
                                >
                            </div>

                            <div class="input-group">
                                <label>Dia da semana</label>

                                <select id="diaSemana">
                                    <option value="1">
                                        Segunda-feira
                                    </option>

                                    <option value="2">
                                        Terça-feira
                                    </option>

                                    <option value="3">
                                        Quarta-feira
                                    </option>

                                    <option value="4">
                                        Quinta-feira
                                    </option>

                                    <option value="5">
                                        Sexta-feira
                                    </option>
                                </select>
                            </div>

                            <div class="input-group">
                                <label>
                                    Quantidade de semanas
                                </label>

                                <input
                                    type="number"
                                    id="quantidadeSemanas"
                                    min="1"
                                    max="16"
                                    value="1"
                                >
                            </div>

                        </div>

                        <div class="linha">

                            <div class="input-group">
                                <label>Horário Inicial</label>

                                <input
                                    type="time"
                                    id="horarioInicioRecorrente"
                                    min="07:00"
                                    max="20:00"
                                    step="3600"
                                >
                            </div>

                            <div class="input-group">
                                <label>Horário Final</label>

                                <input
                                    type="time"
                                    id="horarioFimRecorrente"
                                    min="08:00"
                                    max="21:00"
                                    step="3600"
                                >
                            </div>

                        </div>

                    </div>

                </div>

                <button
                    class="submit-btn"
                    type="submit"
                >
                    Confirmar Reserva
                </button>

            </form>

        </div>

    </div>

    <script src="agenda.js"></script>

</body>

</html>
